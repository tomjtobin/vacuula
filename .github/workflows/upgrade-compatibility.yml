name: Upgrade compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  container-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: docker build -t vacuula:compat-test -f build/docker/Dockerfile .
      - run: python -m unittest discover -s tests -p test_upgrade_compat.py -v
        env:
          VACUULA_TEST_IMAGE: vacuula:compat-test
